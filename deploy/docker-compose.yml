services:
  db:
    image: docker.1ms.run/library/postgres:16
    environment:
      POSTGRES_DB: qms
      POSTGRES_USER: qms
      POSTGRES_PASSWORD: qms
    volumes:
      - qms_pgdata:/var/lib/postgresql/data
    networks:
      - qmsnet

  backend:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://qms:qms@db:5432/qms
      JWT_SECRET: change_me
      JWT_EXPIRE_MIN: 1440
      TZ: Asia/Shanghai
      UPLOAD_DIR: /data/uploads
      UPLOAD_PUBLIC_PREFIX: /uploads/
      CORS_ORIGINS: http://localhost
      FRIGATE_DYNAMIC_LIVE_ENABLED: "true"
      FRIGATE_DYNAMIC_SSH_HOST: ${FRIGATE_DYNAMIC_SSH_HOST:-10.10.131.192}
      FRIGATE_DYNAMIC_SSH_PORT: ${FRIGATE_DYNAMIC_SSH_PORT:-22}
      FRIGATE_DYNAMIC_SSH_USER: ${FRIGATE_DYNAMIC_SSH_USER:-hyperchain}
      FRIGATE_DYNAMIC_SSH_PASSWORD: ${FRIGATE_DYNAMIC_SSH_PASSWORD:-}
      FRIGATE_DYNAMIC_SSH_TIMEOUT_SEC: ${FRIGATE_DYNAMIC_SSH_TIMEOUT_SEC:-10}
      FRIGATE_DYNAMIC_STREAMLIT_URL: ${FRIGATE_DYNAMIC_STREAMLIT_URL:-http://10.10.131.192:8501}
      FRIGATE_DYNAMIC_BUILD_MACHINE_IP: ${FRIGATE_DYNAMIC_BUILD_MACHINE_IP:-10.10.131.192}
      FRIGATE_DYNAMIC_DEPLOY_TARGET_IP: ${FRIGATE_DYNAMIC_DEPLOY_TARGET_IP:-10.10.33.56}
      FRIGATE_DYNAMIC_REMOTE_ROOT: ${FRIGATE_DYNAMIC_REMOTE_ROOT:-/home/hyperchain/dev_workspace/frigate-dynamic/frigateDynamic}
      FRIGATE_DYNAMIC_REMOTE_CONTAINER_NAME: ${FRIGATE_DYNAMIC_REMOTE_CONTAINER_NAME:-frigate-dynamic-web}
      FRIGATE_DYNAMIC_REMOTE_CONTAINER_WORKDIR: ${FRIGATE_DYNAMIC_REMOTE_CONTAINER_WORKDIR:-/workspace/frigateDynamic}
      FRIGATE_DYNAMIC_REMOTE_PYTHON_BIN: ${FRIGATE_DYNAMIC_REMOTE_PYTHON_BIN:-python3}
      CICD_LIVE_ENABLED: "true"
      CICD_BUILD_SSH_HOST: ${CICD_BUILD_SSH_HOST:-172.22.67.76}
      CICD_BUILD_SSH_PORT: ${CICD_BUILD_SSH_PORT:-22}
      CICD_BUILD_SSH_USER: ${CICD_BUILD_SSH_USER:-jinpeng}
      CICD_BUILD_SSH_PASSWORD: ${CICD_BUILD_SSH_PASSWORD:-}
      CICD_BUILD_SSH_TIMEOUT_SEC: ${CICD_BUILD_SSH_TIMEOUT_SEC:-10}
      CICD_BUILD_ROOT_DIR: ${CICD_BUILD_ROOT_DIR:-/data/jinpeng/go-project-build}
      CICD_CLONE_REPO_DIR_NAME: ${CICD_CLONE_REPO_DIR_NAME:-go-hyperchain}
      CICD_TARGET_SSH_HOST: ${CICD_TARGET_SSH_HOST:-}
      CICD_TARGET_SSH_PORT: ${CICD_TARGET_SSH_PORT:-22}
      CICD_TARGET_SSH_USER: ${CICD_TARGET_SSH_USER:-}
      CICD_TARGET_SSH_PASSWORD: ${CICD_TARGET_SSH_PASSWORD:-}
      CICD_TARGET_SSH_TIMEOUT_SEC: ${CICD_TARGET_SSH_TIMEOUT_SEC:-10}
      CICD_TARGET_DEPLOY_DIR: ${CICD_TARGET_DEPLOY_DIR:-/home/hyperchain/dev_workspace/frigate-dynamic/bin_assets/new-hyperchain}
    depends_on:
      - db
    volumes:
      - qms_uploads:/data/uploads
    networks:
      - qmsnet

  frontend:
    build:
      context: ../frontend
    networks:
      - qmsnet

  nginx:
    image: docker.1ms.run/library/nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "${HOST_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - qms_uploads:/var/www/uploads:ro
    networks:
      - qmsnet

networks:
  qmsnet:

volumes:
  qms_pgdata:
  qms_uploads:
