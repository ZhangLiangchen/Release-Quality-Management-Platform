services:
  db:
    image: docker.1ms.run/library/postgres:16
    environment:
      POSTGRES_DB: qms
      POSTGRES_USER: qms
      POSTGRES_PASSWORD: qms
    volumes:
      - qms_pgdata:/var/lib/postgresql/data
    networks:
      - qmsnet

  backend:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://qms:qms@db:5432/qms
      JWT_SECRET: change_me
      JWT_EXPIRE_MIN: 1440
      TZ: Asia/Shanghai
      UPLOAD_DIR: /data/uploads
      UPLOAD_PUBLIC_PREFIX: /uploads/
      CORS_ORIGINS: http://localhost
    depends_on:
      - db
    volumes:
      - qms_uploads:/data/uploads
    networks:
      - qmsnet

  frontend:
    build:
      context: ../frontend
    networks:
      - qmsnet

  nginx:
    image: docker.1ms.run/library/nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "${HOST_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - qms_uploads:/var/www/uploads:ro
    networks:
      - qmsnet

networks:
  qmsnet:

volumes:
  qms_pgdata:
  qms_uploads:
