apiVersion: 1

providers:
  - name: hyperchain-monitoring
    orgId: 1
    folder: Hyperchain Monitoring
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards/hyperchain
  - name: my-server-monitoring
    orgId: 1
