global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node_exporter
    scrape_interval: 15s
    static_configs:
      - targets:
          - monitor-node-exporter:9100
        labels:
          role: monitor

      - targets:
          - 172.22.67.76:9100
          - 172.22.67.77:9100
          - 172.22.67.78:9100
          - 172.22.67.79:9100
          - 172.22.67.80:9100
        labels:
          role: loadgen

      - targets:
          - 172.22.79.31:9100
        labels:
          role: hyperchain_host
