groups:
  - name: host-alerts
    rules:
      - alert: NodeDown
        expr: up{job="node_exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node exporter down on {{ $labels.instance }}"
          description: "Prometheus cannot scrape node_exporter from {{ $labels.instance }} for over 1 minute."

      - alert: HostHighCpu
        expr: |
          (100 - (avg by (instance) (irate(node_cpu_seconds_total{job="node_exporter", mode="idle"}[5m])) * 100)) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage has been above 90% for over 5 minutes."

      - alert: HostHighMemory
        expr: |
          ((1 - (node_memory_MemAvailable_bytes{job="node_exporter"} / node_memory_MemTotal_bytes{job="node_exporter"})) * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage has been above 90% for over 5 minutes."

      - alert: HostDiskUsageHigh
        expr: |
          (
            100 * (
              1 -
              node_filesystem_avail_bytes{job="node_exporter",fstype!~"tmpfs|devtmpfs|overlay|squashfs|ramfs|rootfs",mountpoint!~"/run($|/.*)|/var/lib/docker($|/.*)"} /
              node_filesystem_size_bytes{job="node_exporter",fstype!~"tmpfs|devtmpfs|overlay|squashfs|ramfs|rootfs",mountpoint!~"/run($|/.*)|/var/lib/docker($|/.*)"}
            )
          ) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High disk usage on {{ $labels.instance }} ({{ $labels.mountpoint }})"
          description: "Disk usage has been above 90% for over 10 minutes."
